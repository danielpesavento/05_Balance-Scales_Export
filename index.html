const state = {}; problems.forEach((p, i) => { state[i] = { attempts: 0, locked: false }; });

let currentPage = 0;
const totalPages = problems.length + 1;   // page 0 = worked example

function parseNum(s) {
  s = String(s).trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(-?\d+)\/(\d+)$/); if (m && Number(m[2]) !== 0) return Number(m[1]) / Number(m[2]);
  return NaN;
}
function sameNumber(a, b) { const x = parseNum(a), y = parseNum(b); return !isNaN(x) && !isNaN(y) && Math.abs(x - y) <= TOL + 1e-9; }

function buildQuiz() {
  const container = document.getElementById("batchContainer");
  const ex = document.createElement("div");
  ex.className = "batch active"; ex.id = "batch-0";
  ex.innerHTML = `<div class="example-wrap"><h2>Worked Example</h2><p>Read the example one step at a time. Then click <strong>Next</strong> at the bottom to start the problems.</p>${KEY_HTML}<div class="stepper" id="stepper"></div></div>`;
  container.appendChild(ex);
  problems.forEach((p, i) => {
    const n = i + 1, div = document.createElement("div");
    div.className = "batch"; div.id = "batch-" + n;
    const row = (k, label, aria) => `<div class="ans-row" id="row-${n}-${k}"><div class="ans-label">${label}</div><div class="ans-right"><span class="badge" id="badge-${n}-${k}"></span><input type="text" class="answer-input" id="input-${n}-${k}" maxlength="7" inputmode="${ALLOW_DECIMALS ? "decimal" : "numeric"}" placeholder="?" autocomplete="off" aria-label="${aria}" oninput="onEdit(${n},'${k}')"></div></div>`;
    div.innerHTML = `<div class="question" id="q${n}">
      <div class="question-label">Problem ${n} of ${problems.length}</div>
      <div class="question-text">Use the balanced scales to find the missing numbers.</div>
      <div class="question-instructions">${INSTRUCTIONS}</div>
      ${KEY_HTML}
      <div class="scales-wrap">${drawScales(p.scales)}</div>
      ${row("a", `Weight of one ${shapeIcon(p.first)} =`, `Problem ${n}: weight of one ${p.first}`)}
      ${row("b", `<span style="font-size:1.2em">?</span> =`, `Problem ${n}: value of the question mark`)}
      <div class="btn-row">
        <button type="button" class="hint-btn" onclick="toggleHint(${n})">Hint</button>
        <button type="button" class="check-btn" id="check-btn-${n}" onclick="checkAnswer(${n})">Submit Answer</button>
        <button type="button" class="answer-btn" id="answer-btn-${n}" onclick="showAnswer(${n})">Show Answer</button>
        <button type="button" class="clear-btn" onclick="clearQuestion(${n})">Clear Answer</button>
        <button type="button" class="teach-btn" id="teach-btn-${n}" onclick="toggleTeach(${n})">Teach</button>
      </div>
      <div class="hint-box" id="hint-${n}">${p.hint}</div>
      <div class="feedback" id="feedback-${n}"></div>
      <div class="explainer" id="explainer-${n}">${p.explainer}</div>
      <div class="teach-panel" id="teach-panel-${n}">
        <div class="teach-answer"><strong>Answers: one ${p.first} = ${p.a1}, and ? = ${p.a2}</strong></div>
        <h4>The scales with every weight filled in</h4>
        <div class="scales-wrap">${drawScales(p.scales, { vals: p.vals })}</div>
        <h4>Step-by-Step</h4>
        <div class="teach-steps">${p.steps}</div>
      </div></div>`;
    container.appendChild(div);
  });
  initStepper("stepper", EXAMPLE);
  updateNav();
}
function show(page) {
  document.getElementById("batch-" + currentPage).classList.remove("active");
  currentPage = page;
  document.getElementById("batch-" + currentPage).classList.add("active");
  updateNav(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function updateNav() { document.getElementById("backBtn").disabled = (currentPage === 0); document.getElementById("nextBtn").disabled = (currentPage === totalPages - 1); }
function goNext() { if (currentPage < totalPages - 1) show(currentPage + 1); }
function goBack() { if (currentPage > 0) show(currentPage - 1); }
function toggleHint(n) { const b = document.getElementById("hint-" + n); b.style.display = (b.style.display === "block") ? "none" : "block"; }
function toggleTeach(n) { const p = document.getElementById("teach-panel-" + n); p.style.display = (p.style.display === "block") ? "none" : "block"; }

function onEdit(n, k) {
  const input = document.getElementById(`input-${n}-${k}`);
  const cleaned = ALLOW_DECIMALS ? input.value.replace(/[^0-9./]/g, "") : input.value.replace(/[^0-9]/g, "");
  if (cleaned !== input.value) input.value = cleaned;
  if (!state[n - 1].locked) { document.getElementById(`row-${n}-${k}`).classList.remove("correct", "incorrect"); document.getElementById(`badge-${n}-${k}`).textContent = ""; }
}
function mark(n, k, ok) {
  const row = document.getElementById(`row-${n}-${k}`), badge = document.getElementById(`badge-${n}-${k}`);
  row.classList.remove("correct", "incorrect"); row.classList.add(ok ? "correct" : "incorrect");
  badge.className = "badge " + (ok ? "correct" : "incorrect"); badge.textContent = ok ? "\u2713" : "\u2717";
}
function checkAnswer(n) {
  const p = problems[n - 1], feedback = document.getElementById("feedback-" + n);
  if (state[n - 1].locked) return;
  const a = document.getElementById(`input-${n}-a`).value.trim(), b = document.getElementById(`input-${n}-b`).value.trim();
  if (!a || !b) { alert("Please type an answer in both boxes before clicking Submit Answer."); return; }
  const okA = sameNumber(a, p.a1), okB = sameNumber(b, p.a2);
  mark(n, "a", okA); mark(n, "b", okB);
  if (okA && okB) {
    feedback.textContent = "Correct!"; feedback.className = "feedback correct";
    state[n - 1].locked = true; document.getElementById("check-btn-" + n).disabled = true;
    return;
  }
  state[n - 1].attempts += 1;
  const remaining = ATTEMPTS_BEFORE_ANSWER_BUTTON - state[n - 1].attempts;
  const which = (!okA && !okB) ? "Neither box is right yet" : (!okA ? "The first box is not right yet" : "The second box is not right yet");
  if (remaining > 0) {
    feedback.textContent = `${which} - try again. (${remaining} attempt${remaining === 1 ? "" : "s"} left before the Show Answer button appears)`;
  } else {
    feedback.textContent = `${which}. Click "Show Answer" for a detailed explanation, or click "Clear Answer" to try fresh.`;
    document.getElementById("answer-btn-" + n).style.display = "inline-block";
  }
  feedback.className = "feedback incorrect";
}
function showAnswer(n) { document.getElementById("explainer-" + n).style.display = "block"; }
function clearQuestion(n) {
  ["a", "b"].forEach(k => {
    document.getElementById(`input-${n}-${k}`).value = "";
    document.getElementById(`row-${n}-${k}`).classList.remove("correct", "incorrect");
    document.getElementById(`badge-${n}-${k}`).textContent = "";
  });
  state[n - 1].attempts = 0; state[n - 1].locked = false;
  document.getElementById("check-btn-" + n).disabled = false;
  document.getElementById("answer-btn-" + n).style.display = "none";
  document.getElementById("explainer-" + n).style.display = "none";
  const fb = document.getElementById("feedback-" + n); fb.textContent = ""; fb.className = "feedback";
  document.getElementById("hint-" + n).style.display = "none";
}
buildQuiz();
</script>
